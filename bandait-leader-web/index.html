<!doctype html>
<html lang="es" data-theme="dark-grafito">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111316" />
    <script>
      // Apariencia antes del primer render (services/appearance.ts, APPEARANCE_CACHE_KEY): tema,
      // acento y redondez del ultimo uso en este navegador. Mismo filtro que parseAppearanceCache.
      (function () {
        try {
          var c = JSON.parse(localStorage.getItem('bandait_ui_appearance') || 'null');
          if (!c || typeof c !== 'object') return;
          var root = document.documentElement;
          if (c.theme === 'dark-grafito' || c.theme === 'light-estudio') {
            root.setAttribute('data-theme', c.theme);
            root.style.colorScheme = c.theme === 'light-estudio' ? 'light' : 'dark';
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', c.theme === 'light-estudio' ? '#F2F3F5' : '#111316');
          }
          var vars = c.vars && typeof c.vars === 'object' ? c.vars : {};
          for (var k in vars) {
            var v = vars[k];
            if (/^--b-[a-z-]+$/.test(k) && typeof v === 'string' && /^[#0-9a-zA-Z.%(), -]{1,40}$/.test(v)) root.style.setProperty(k, v);
          }
          // Tipografia (services/fonts.ts): ids conocidos y la hoja de Google Fonts si no es IBM Plex.
          var GF = {
            'inter': 'Inter:wght@400;500;600;700',
            'dm-sans': 'DM+Sans:wght@400;500;600;700',
            'jakarta': 'Plus+Jakarta+Sans:wght@400;500;600;700',
            'manrope': 'Manrope:wght@400;500;600;700',
            'geist': 'Geist:wght@400;500;600;700',
            'geist-mono': 'Geist+Mono:wght@400;500;600;700'
          };
          var f = c.font && typeof c.font === 'object' ? c.font : {};
          var fams = [];
          if (typeof f.ui === 'string' && /^[a-z-]{1,20}$/.test(f.ui)) {
            root.setAttribute('data-font-ui', f.ui);
            if (GF.hasOwnProperty(f.ui) && f.ui !== 'geist-mono') fams.push(GF[f.ui]);
          }
          if (typeof f.labels === 'string' && /^[a-z-]{1,20}$/.test(f.labels)) {
            root.setAttribute('data-font-labels', f.labels);
            if (f.labels === 'geist-mono') fams.push(GF['geist-mono']);
          }
          if (fams.length) {
            var l = document.createElement('link');
            l.rel = 'stylesheet';
            l.href = 'https://fonts.googleapis.com/css2?family=' + fams.join('&family=') + '&display=swap';
            l.setAttribute('data-bandait-font', '1');
            document.head.appendChild(l);
          }
        } catch (e) {
          // cache danada o sin almacenamiento: queda Dark Grafito
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Bandait — Cloud & Web Admin Hub</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
