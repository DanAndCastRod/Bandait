[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bandait-leader"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "soundfile>=0.12.1",
    "python-socketio>=5.9.0",
    "uvicorn[standard]>=0.24.0",
    "google-generativeai>=0.3.0",
    "SQLAlchemy>=2.0.0",
    "alembic>=1.12.0",
    "keyring>=24.3.0",
    "qasync>=0.27.0",
    "python-rtmidi>=1.5.0",
    "mido>=1.3.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.1.0", "pytest>=7.4.0", "pytest-qt>=4.2.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501", "N802", "N806", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"
