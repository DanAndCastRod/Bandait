[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bandait-leader"
version = "2.1.0"  # = APP_VERSION in src/ui/main_window.py (tests/test_packaging.py)
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
dependencies = [
    "PySide6>=6.6.0",
    "sounddevice>=0.5.4",
    "numpy>=1.24.0",
    "soundfile>=0.12.1",
    "python-socketio>=5.9.0",
    "uvicorn[standard]>=0.24.0",
    "google-generativeai>=0.3.0",
    "SQLAlchemy>=2.0.0",
    "alembic>=1.12.0",
    "keyring>=24.3.0",
    "qasync>=0.27.0",
    "python-rtmidi>=1.5.0",
    "mido>=1.3.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.1.0", "pytest>=7.4.0", "pytest-qt>=4.2.0", "aiohttp>=3.9"]
# Windows installer: python scripts/build_exe.py, then Inno Setup (see README).
build = ["pyinstaller>=6.10"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "E402", "F401", "F841", "F811", "F541"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Modules are imported as "src.*" from the bandait-leader root (works for both
# "pytest" and "python -m pytest").
pythonpath = ["."]
qt_api = "pyside6"
# pytest-asyncio is not used (async tests drive their own loop with asyncio.run).
addopts = "-p no:asyncio"
