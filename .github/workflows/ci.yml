name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Ningun paso enmascara fallos (sin `|| true`): una prueba roja debe poner el CI en rojo.

jobs:
  leader:
    name: Leader (Python)
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        working-directory: bandait-leader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: bandait-leader/requirements.txt
      - name: System libraries for PySide6 (offscreen) and PortAudio
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libportaudio2
      - run: pip install -r requirements.txt
      - run: ruff check src tests
      - run: python -m pytest -q

  follower:
    name: Follower (PWA)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bandait-follower
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: bandait-follower/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build

  hub:
    name: Web Admin Hub
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bandait-leader-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: bandait-leader-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run verify:logic
      - run: npm run build
