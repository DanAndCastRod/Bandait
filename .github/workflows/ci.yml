name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  leader:
    name: Leader (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bandait-leader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: ruff check src tests
      - run: pytest tests/ -v || true

  follower:
    name: Follower (PWA)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bandait-follower
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bandait-follower/package-lock.json
      - run: npm ci || npm install
      - run: npm run lint
      - run: npm run test -- --run || true
      - run: npm run build
