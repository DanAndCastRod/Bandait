name: Release (lider Windows)

# Instalador del lider de escritorio para Windows (PyInstaller onedir + Inno Setup 6).
# - Tag vX.Y.Z (debe coincidir con APP_VERSION, ver bandait-leader/scripts/version.py):
#   build, smoke test del .exe empaquetado, instalador y GitHub Release.
# - workflow_dispatch: lo mismo sin Release (solo artefactos del workflow).
# - pull_request que toque el lider o este workflow: lo mismo sin Release, para verificar
#   antes del merge que el .exe empaquetado arranca y que el instalador compila.
# Sin secretos ni firma: el instalador sale sin firmar (SmartScreen avisa al usuario).
# El unico token es el GITHUB_TOKEN automatico, para publicar el Release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'bandait-leader/**'
      - 'landing/app/**'
      - '.github/workflows/release.yml'
      - 'LICENSE'
      - 'NOTICE.md'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Instalador Windows
    # windows-latest = Windows Server 2025; trae Inno Setup 6 (6.7.1 en la imagen
    # 20260922, actions/runner-images Windows2025-Readme.md). Si faltara, se instala con choco.
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write  # gh release create (solo en tags)
    defaults:
      run:
        shell: pwsh
        working-directory: bandait-leader
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: bandait-leader/requirements.txt

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Version
        id: version
        run: |
          $v = (python scripts/version.py).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $v) { throw "no se pudo leer APP_VERSION" }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            python scripts/version.py --check-tag "$env:GITHUB_REF_NAME"
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "Bandait Leader $v"

      - name: Pruebas de empaquetado
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q tests/test_packaging.py
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build (PyInstaller onedir)
        env:
          BANDAIT_STRICT_NOTICE: '1'  # falla si un paquete incluido no esta en NOTICE.md
        run: |
          python scripts/build_exe.py
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Smoke test del exe empaquetado
        run: |
          $exe = (Resolve-Path dist/BandaitLeader/BandaitLeader.exe).Path
          $out = Join-Path $env:RUNNER_TEMP 'smoke.json'
          # Start-Process sin redireccion = como un doble clic (sin consola): el caso real.
          $p = Start-Process -FilePath $exe -ArgumentList '--smoke-test', '--smoke-out', "`"$out`"" -Wait -PassThru
          if (-not (Test-Path $out)) { throw "el smoke test no escribio $out (codigo $($p.ExitCode))" }
          Get-Content $out
          $result = Get-Content $out -Raw | ConvertFrom-Json
          if ($p.ExitCode -ne 0 -or -not $result.ok) { throw "smoke test fallido (codigo $($p.ExitCode))" }

      - name: Instalador (Inno Setup 6)
        run: |
          $candidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe')
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit 1 }
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe no encontrado" }
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.version }}" scripts/installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Empaquetar artefactos
        run: |
          $v = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item "dist/installer/BandaitLeader-Setup-$v.exe" out/
          Copy-Item ../NOTICE.md out/
          Compress-Archive -Path dist/BandaitLeader -DestinationPath "out/BandaitLeader-$v-win64-portable.zip"
          $sums = foreach ($name in @("BandaitLeader-Setup-$v.exe", 'NOTICE.md')) {
            '{0}  {1}' -f (Get-FileHash (Join-Path out $name) -Algorithm SHA256).Hash.ToLower(), $name
          }
          $sums | Set-Content -Encoding ascii out/SHA256SUMS
          Get-Content out/SHA256SUMS
          Get-ChildItem out | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: BandaitLeader-${{ steps.version.outputs.version }}-windows
          path: bandait-leader/out/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/smoke.json
          if-no-files-found: ignore

      - name: GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $tag = $env:GITHUB_REF_NAME
          $notes = @"
          Bandait Leader $v para Windows 10/11 (64 bits).

          **Instalar:** descargue ``BandaitLeader-Setup-$v.exe`` y ejecútelo. El instalador no está
          firmado, así que Windows muestra "Windows protegió su PC": pulse **Más información** y
          luego **Ejecutar de todas formas**. Compruebe la descarga con ``SHA256SUMS``.

          El instalador abre el Firewall de Windows para el líder solo en redes **privadas**: marque
          la red del escenario como privada para que los teléfonos se conecten.

          **Licencia y código fuente:** Bandait es software libre bajo GPL-3.0-or-later. El código
          fuente correspondiente a esta versión son los archivos "Source code (zip)" y
          "Source code (tar.gz)" que GitHub adjunta a este Release (etiqueta $tag).
          ``NOTICE.md`` lista los componentes de terceros incluidos (Qt/PySide6 LGPLv3, PortAudio con
          ASIO SDK GPLv3, etc.), sus licencias y dónde obtener sus fuentes.
          "@
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          $assets = @("out/BandaitLeader-Setup-$v.exe", 'out/NOTICE.md', 'out/SHA256SUMS')
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --verify-tag --title "Bandait Leader $v" --notes-file release-notes.md
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
