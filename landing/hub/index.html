<!doctype html>
<html lang="es" data-theme="dark-grafito">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111316" />
    <script>
      // Apariencia antes del primer render (services/appearance.ts, APPEARANCE_CACHE_KEY): tema,
      // acento y redondez del ultimo uso en este navegador. Mismo filtro que parseAppearanceCache.
      (function () {
        try {
          var c = JSON.parse(localStorage.getItem('bandait_ui_appearance') || 'null');
          if (!c || typeof c !== 'object') return;
          var root = document.documentElement;
          if (c.theme === 'dark-grafito' || c.theme === 'light-estudio') {
            root.setAttribute('data-theme', c.theme);
            root.style.colorScheme = c.theme === 'light-estudio' ? 'light' : 'dark';
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', c.theme === 'light-estudio' ? '#F2F3F5' : '#111316');
          }
          var vars = c.vars && typeof c.vars === 'object' ? c.vars : {};
          for (var k in vars) {
            var v = vars[k];
            if (/^--b-[a-z-]+$/.test(k) && typeof v === 'string' && /^[#0-9a-zA-Z.%(), -]{1,40}$/.test(v)) root.style.setProperty(k, v);
          }
        } catch (e) {
          // cache danada o sin almacenamiento: queda Dark Grafito
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" crossorigin href="./assets/index-BRJIwQsI.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
